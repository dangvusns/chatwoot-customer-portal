services:
  portal_test:
    build:
      context: ./chatwoot-customer-portal
      dockerfile: docker/portal-test.Dockerfile
    env_file: .env
    environment:
      RAILS_ENV: test
      NODE_ENV: test
      POSTGRES_DATABASE: chatwoot_customer_portal_test
      REDIS_URL: redis://redis:6379/14
      BUNDLE_WITHOUT: ''
    depends_on:
      - postgres
      - redis
